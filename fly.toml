app = "ray-reg-bom"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HOST_PROJECT_PATH = "/app"
  PYTHONUNBUFFERED = "1"

[[mounts]]
  source = "openai_cpa_data"
  destination = "/app/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
